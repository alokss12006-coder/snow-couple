<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Snow Couple ☃️💕</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #142b46;
      --bg-bottom: #050d19;
      --screen-bg: #020813;
      --screen-border: #34516e;
      --accent-cyan: #7dd3fc;
      --accent-pink: #f472b6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom) 72%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Safe-area aware main container */
    #app-wrapper {
      width: 100%;
      height: 100%;
      max-width: 960px;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Main Display Screen with soft cyan glow */
    #screen {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background-color: var(--screen-bg);
      border: 1.5px solid var(--screen-border);
      border-radius: 24px;
      box-shadow:
        0 0 35px rgba(56, 189, 248, 0.14),
        0 18px 40px rgba(0, 0, 0, 0.65),
        inset 0 0 28px rgba(14, 165, 233, 0.08);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Custom Range Slider */
    input[type="range"].winter-slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].winter-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(52, 81, 110, 0.65);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }

    input[type="range"].winter-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #e0f2fe;
      border: 2px solid #38bdf8;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.65);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    input[type="range"].winter-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: #ffffff;
    }

    input[type="range"].winter-slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(52, 81, 110, 0.65);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }

    input[type="range"].winter-slider::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #e0f2fe;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.65);
    }

    /* Pill buttons styling */
    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: rgba(15, 33, 55, 0.82);
      border: 1px solid rgba(52, 81, 110, 0.9);
      color: #e2e8f0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .pill-btn:hover {
      background: rgba(24, 52, 84, 0.95);
      border-color: #60a5fa;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.2);
    }

    .pill-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .pill-btn.active {
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.7), rgba(29, 78, 216, 0.65));
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }

    @media (max-width: 480px) {
      .pill-btn {
        padding: 8px 14px;
        font-size: 0.8125rem;
      }
      #screen {
        border-radius: 18px;
      }
    }

    /* ---- Mobile polish ---- */
    html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
    body { touch-action: manipulation; }
    .pill-btn { min-height: 44px; }
    input[type="range"].winter-slider { min-height: 32px; touch-action: pan-y; }
    input[type="range"].winter-slider::-webkit-slider-thumb { height: 22px; width: 22px; margin-top: -9px; }
    input[type="range"].winter-slider::-moz-range-thumb { height: 22px; width: 22px; }
    @media (max-width: 480px) {
      #app-wrapper { gap: 8px; }
      footer { gap: 8px !important; }
      .pill-btn { padding: 8px 13px; flex: 1 1 auto; }
      footer > div:first-child { width: 100%; justify-content: center; }
      footer > div:last-child { width: 100%; justify-content: center; }
      footer > div:last-child input { flex: 1 1 auto; max-width: 160px; }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      header p { display: none; }
      #app-wrapper { gap: 6px; }
      .pill-btn { min-height: 38px; padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <!-- Top Header & Subtitle -->
    <header class="w-full flex flex-col items-center text-center pt-0.5 shrink-0">
      <div class="flex items-center gap-2">
        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-sky-100 drop-shadow-[0_2px_10px_rgba(125,211,252,0.3)]">
          Snow Couple ☃️💕
        </h1>
        <span id="status-badge" class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-sky-950/80 border border-sky-700/50 text-sky-300">
          Ready
        </span>
      </div>
      <p id="subtitle" class="text-xs sm:text-sm text-sky-200/80 mt-0.5 font-normal">
        Watch them build, block by block… ❄️
      </p>
    </header>

    <!-- Main Interactive Canvas Container -->
    <main id="screen" title="Tap canvas to spawn hearts or sparkles ✨">
      <canvas id="scene"></canvas>

      <!-- Subtle Progress Pill inside bottom-right of canvas -->
      <div class="pointer-events-none absolute bottom-3 right-3.5 flex items-center gap-2 px-2.5 py-1 rounded-full bg-[#050d19]/70 backdrop-blur-sm border border-[#34516e]/60 text-[11px] text-sky-200/80">
        <span id="audio-status" class="text-sky-300/90">♪ Ready</span>
        <span class="text-sky-600">•</span>
        <span id="progress-label">0%</span>
        <div class="w-14 sm:w-20 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-400 to-pink-400 w-0 transition-all duration-150"></div>
        </div>
      </div>

      <!-- Interactive Hint -->
      <div id="tap-hint" class="pointer-events-none absolute top-3 left-3.5 px-2.5 py-1 rounded-full bg-[#050d19]/60 backdrop-blur-sm border border-[#34516e]/50 text-[11px] text-sky-300/75 transition-opacity duration-500">
        ✨ Tap anywhere for magic
      </div>
    </main>

    <!-- Controls Bar -->
    <footer class="w-full flex flex-wrap items-center justify-center gap-2.5 sm:gap-4 pb-0.5 shrink-0">
      <div class="flex items-center gap-2">
        <button id="btn-start" class="pill-btn active" aria-label="Start animation and music">
          <span>▶</span><span>Start</span>
        </button>
        <button id="btn-stop" class="pill-btn" aria-label="Pause animation and music">
          <span>Ⅱ</span><span>Stop</span>
        </button>
        <button id="btn-replay" class="pill-btn" aria-label="Replay from beginning">
          <span>↻</span><span>Replay</span>
        </button>
      </div>

      <!-- Music Volume Control -->
      <div class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-[#0f2137]/75 border border-[#34516e]/80 shadow-md">
        <label for="volume-slider" class="text-xs sm:text-sm font-medium text-sky-200 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span id="vol-icon">♫</span>
          <span>Music volume</span>
        </label>
        <input
          id="volume-slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.8"
          class="winter-slider w-24 sm:w-28"
          aria-label="Music volume"
        />
      </div>
    </footer>
  </div>

  <script>
    /**
     * Snow Couple ☃️💕 - High-DPI Zero-Lag Interactive Canvas & Web Audio Music Box
     * Architectural highlights:
     * 1. Offscreen static layer caching (sky gradient, stars, glowing moon, snowy hills) for 60-120fps performance.
     * 2. Smart DPR scaling (capped at 2 on mobile devices) to guarantee razor-sharp pixels without fill-rate bottlenecks.
     * 3. Delta-time normalized physics & spring-interpolated voxel/block placement.
     * 4. Procedural polyphonic Web Audio winter music box with warm celesta/bell harmonics and soft pad.
     */
    (() => {
      'use strict';

      // ==========================================
      // 1. HOLIDAY SYNTH-POP ENGINE ("SNOWMAN" INSPIRED) + CUSTOM AUDIO
      // ==========================================
      class HolidaySnowmanMusicEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.volume = 0.8;
          this.isPlaying = false;
          this.stepIndex = 0;
          this.timerId = null;
          this.nextNoteTime = 0;
          this.tempo = 105; // Upbeat 6/8 or 12/8 winter swing-pop feel (105 BPM dotted-quarter pulse)

          // Optional user-uploaded HTML5 Audio element
          this.customAudio = null;
          this.customAudioUrl = null;
          this.useCustomAudio = false;

          // Warm Holiday Synth-Pop Arrangement inspired by "Snowman" (Db Major / Bb Minor warmth)
          // Each step = 1 eighth-note triplet / 12/8 subdivision (6 subdivisions per beat)
          // Frequencies in Hz
          const N = {
            R: 0,
            // Bass notes
            Db2: 69.30, F2: 87.31, Gb2: 92.50, Ab2: 103.83, Bb2: 116.54, Eb2: 77.78,
            // Chord & Melody notes (Db Major: Db, Eb, F, Gb, Ab, Bb, C)
            Ab3: 207.65, Bb3: 233.08, C4: 261.63, Db4: 277.18, Eb4: 311.13, F4: 349.23,
            Gb4: 369.99, Ab4: 415.30, Bb4: 466.16, C5: 523.25, Db5: 554.37, Eb5: 622.25,
            F5: 698.46, Gb5: 739.99, Ab5: 830.61
          };

          // Synchronized lyric phrases shown subtly as the snow couple builds!
          this.phrases = [
            "Building our snow couple… ❄️",
            "Block by block, together ☃️",
            "Winter night, warm hearts 🏡❄️",
            "Almost there… ✨",
            "Holding hands soon 🌙💕",
            "Forever snow love 🎶❤️"
          ];

          // 12/8 Swing-Pop Sequence (each step = 1 eighth note, 6 eighth notes per bar)
          // m: melody freq, d: melody duration in eighths, c: chord array, b: bass freq, p: percussion ('K'=kick, 'S'=snare+sleigh, 'H'=sleigh hat)
          this.sequence = [
            // Bar 1 (DbMaj7): "I want you to know that I'm..."
            { m: N.F4,  d: 1, c: [N.Db4, N.F4, N.Ab4, N.C5], b: N.Db2, p: 'K' },
            { m: N.Ab4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Db5, d: 1, c: [N.Db4, N.F4, N.Ab4, N.C5], b: N.Ab2, p: 'S' },
            { m: N.Bb4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: null,                      b: 0,     p: 'H' },

            // Bar 2 (Fm7): "...ne-ver lea-ving, 'cause I'm..."
            { m: N.Bb4, d: 2, c: [N.C4, N.Eb4, N.Ab4, N.C5], b: N.F2,  p: 'K' },
            { m: N.R,   d: 0, c: null,                      b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.F4,  d: 1, c: [N.C4, N.Eb4, N.Ab4, N.C5], b: N.C2 || 65.41, p: 'S' },
            { m: N.Ab4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                      b: 0,     p: 'H' },

            // Bar 3 (Bbm7): "...Mis-ses Snow, 'til death we'll be..."
            { m: N.Db5, d: 2, c: [N.Db4, N.F4, N.Ab4, N.Bb4], b: N.Bb2, p: 'K' },
            { m: N.R,   d: 0, c: null,                       b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: [N.Db4, N.F4, N.Ab4, N.Bb4], b: N.F2,  p: 'S' },
            { m: N.F4,  d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: null,                       b: 0,     p: 'H' },

            // Bar 4 (GbMaj7 -> Ab): "...free-zing, yeah you are my..."
            { m: N.Bb4, d: 2, c: [N.Db4, N.Gb4, N.Bb4],      b: N.Gb2, p: 'K' },
            { m: N.R,   d: 0, c: null,                       b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.F4,  d: 1, c: [N.Eb4, N.Ab4, N.C5],       b: N.Ab2, p: 'S' },
            { m: N.Ab4, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                       b: 0,     p: 'H' },

            // Bar 5 (DbMaj7): "...home, my home for all sea-sons..."
            { m: N.Db5, d: 2, c: [N.Db4, N.F4, N.Ab4, N.C5], b: N.Db2, p: 'K' },
            { m: N.R,   d: 0, c: null,                      b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Db5, d: 1, c: [N.Db4, N.F4, N.Ab4, N.C5], b: N.Ab2, p: 'S' },
            { m: N.Eb5, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Db5, d: 1, c: null,                      b: 0,     p: 'H' },

            // Bar 6 (Fm7): "...so come on, let's go..."
            { m: N.C5,  d: 2, c: [N.C4, N.Eb4, N.Ab4, N.C5], b: N.F2,  p: 'K' },
            { m: N.R,   d: 0, c: null,                      b: 0,     p: 'H' },
            { m: N.Ab4, d: 1, c: null,                      b: 0,     p: 'H' },
            { m: N.Bb4, d: 2, c: [N.C4, N.Eb4, N.Ab4, N.C5], b: N.Ab2, p: 'S' },
            { m: N.R,   d: 0, c: null,                      b: 0,     p: 'H' },
            { m: N.C5,  d: 1, c: null,                      b: 0,     p: 'H' },

            // Bar 7 (Bbm7 -> Chorus Lift!): "Let's go be-low ze-ro..."
            { m: N.Db5, d: 1, c: [N.Db4, N.F4, N.Ab4, N.Bb4], b: N.Bb2, p: 'K' },
            { m: N.Eb5, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.F5,  d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Eb5, d: 1, c: [N.Db4, N.F4, N.Ab4, N.Bb4], b: N.F2,  p: 'S' },
            { m: N.Db5, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Bb4, d: 1, c: null,                       b: 0,     p: 'H' },

            // Bar 8 (GbMaj7 -> Ab6): "...and hide from the sun, I love you for-e-ver!"
            { m: N.Db5, d: 1, c: [N.Db4, N.Gb4, N.Bb4],      b: N.Gb2, p: 'K' },
            { m: N.Eb5, d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.F5,  d: 1, c: null,                       b: 0,     p: 'H' },
            { m: N.Ab5, d: 2, c: [N.Eb4, N.Ab4, N.C5],       b: N.Ab2, p: 'S' },
            { m: N.R,   d: 0, c: null,                       b: 0,     p: 'H' },
            { m: N.F5,  d: 1, c: null,                       b: 0,     p: 'H' }
          ];
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
            this.masterGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        loadCustomFile(file) {
          if (!file) return false;
          if (this.customAudioUrl) {
            URL.revokeObjectURL(this.customAudioUrl);
          }
          this.customAudioUrl = URL.createObjectURL(file);
          if (!this.customAudio) {
            this.customAudio = new Audio();
            this.customAudio.loop = true;
          }
          this.customAudio.src = this.customAudioUrl;
          this.customAudio.volume = this.volume;
          this.useCustomAudio = true;

          // Stop synth scheduler if running and switch smoothly to uploaded track
          if (this.timerId) {
            clearTimeout(this.timerId);
            this.timerId = null;
          }
          if (this.isPlaying) {
            this.customAudio.play().catch(() => {});
          }
          return true;
        }

        setVolume(val) {
          this.volume = Math.max(0, Math.min(1, val));
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.04);
          }
          if (this.customAudio) {
            this.customAudio.volume = this.volume;
          }
        }

        // Warm Retro Electric Piano Chord
        playChord(freqs, time, durationSec) {
          if (!this.ctx || !this.masterGain || !freqs) return;
          freqs.forEach((f) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, time);

            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.linearRampToValueAtTime(0.055, time + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec * 1.15);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(time);
            osc.stop(time + durationSec * 1.2);
          });
        }

        // Expressive Vocal-Style Holiday Lead Synth
        playLead(freq, time, durationSec) {
          if (!this.ctx || !this.masterGain || freq <= 0 || durationSec <= 0) return;

          const oscMain = this.ctx.createOscillator();
          const oscHarm = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          oscMain.type = 'sawtooth';
          oscMain.frequency.setValueAtTime(freq, time);

          oscHarm.type = 'sine';
          oscHarm.frequency.setValueAtTime(freq * 2, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1650, time);
          filter.frequency.exponentialRampToValueAtTime(950, time + durationSec);

          const harmGain = this.ctx.createGain();
          harmGain.gain.setValueAtTime(0.06, time);

          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(0.14, time + 0.03);
          gain.gain.setValueAtTime(0.12, time + durationSec * 0.75);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec * 1.15);

          oscMain.connect(filter);
          oscHarm.connect(harmGain);
          harmGain.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          oscMain.start(time);
          oscHarm.start(time);
          oscMain.stop(time + durationSec * 1.2);
          oscHarm.stop(time + durationSec * 1.2);
        }

        // Warm Retro Motown/Holiday Bass
        playBass(freq, time, durationSec) {
          if (!this.ctx || !this.masterGain || freq <= 0) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);

          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(0.22, time + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec * 1.4);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + durationSec * 1.45);
        }

        // Soft Kick, Rim-Snare & Sleigh Bells
        playPercussion(type, time) {
          if (!this.ctx || !this.masterGain || !type) return;

          if (type === 'K') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(115, time);
            osc.frequency.exponentialRampToValueAtTime(42, time + 0.12);
            gain.gain.setValueAtTime(0.22, time);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(time);
            osc.stop(time + 0.15);
          } else if (type === 'S' || type === 'H') {
            // Crisp Sleigh-Bell Jingle shimmer using high inharmonic partials
            const partials = type === 'S' ? [2637, 3520, 4698, 6271] : [3520, 5274];
            const peak = type === 'S' ? 0.038 : 0.018;
            const decay = type === 'S' ? 0.16 : 0.07;

            partials.forEach((pFreq) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(pFreq, time);
              gain.gain.setValueAtTime(peak, time);
              gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);
              osc.connect(gain);
              gain.connect(this.masterGain);
              osc.start(time);
              osc.stop(time + decay + 0.01);
            });
          }
        }

        playSparkleChime() {
          if (this.volume <= 0.01) return;
          this.initContext();
          const now = this.ctx.currentTime;
          [1108.73, 1396.91, 1661.22].forEach((n, idx) => {
            this.playLead(n, now + idx * 0.05, 0.35);
          });
        }

        getCurrentLyricPhrase() {
          const barIndex = Math.floor((this.stepIndex % this.sequence.length) / 6);
          const phraseIdx = Math.min(this.phrases.length - 1, Math.floor((barIndex / 8) * this.phrases.length));
          return this.phrases[phraseIdx];
        }

        scheduler() {
          if (!this.isPlaying || this.useCustomAudio) return;
          // 12/8 groove: 3 eighth-notes per beat at 105 BPM
          const eighthSec = (60 / this.tempo) / 3;

          while (this.nextNoteTime < this.ctx.currentTime + 0.16) {
            const step = this.sequence[this.stepIndex % this.sequence.length];

            if (step.c) {
              this.playChord(step.c, this.nextNoteTime, eighthSec * 2.8);
            }
            if (step.b > 0) {
              this.playBass(step.b, this.nextNoteTime, eighthSec * 2.6);
            }
            if (step.m > 0 && step.d > 0) {
              this.playLead(step.m, this.nextNoteTime, step.d * eighthSec);
            }
            if (step.p) {
              this.playPercussion(step.p, this.nextNoteTime);
            }

            this.nextNoteTime += eighthSec;
            this.stepIndex++;
          }
          this.timerId = setTimeout(() => this.scheduler(), 40);
        }

        start() {
          if (this.isPlaying) return;
          this.isPlaying = true;
          if (this.useCustomAudio && this.customAudio) {
            this.customAudio.play().catch(() => {});
          } else {
            this.initContext();
            this.nextNoteTime = this.ctx.currentTime + 0.05;
            this.scheduler();
          }
        }

        stop() {
          this.isPlaying = false;
          if (this.timerId) {
            clearTimeout(this.timerId);
            this.timerId = null;
          }
          if (this.customAudio) {
            this.customAudio.pause();
          }
        }

        reset() {
          this.stepIndex = 0;
          if (this.useCustomAudio && this.customAudio) {
            this.customAudio.currentTime = 0;
            if (this.isPlaying) {
              this.customAudio.play().catch(() => {});
            }
          } else if (this.isPlaying && this.ctx) {
            this.nextNoteTime = this.ctx.currentTime + 0.05;
          }
        }
      }

      // ==========================================
      // 2. SNOW COUPLE VOXEL/BLOCK BLUEPRINT BUILDER
      // ==========================================
      function buildSnowCoupleBlocks() {
        const blocks = [];

        // Helper to push a block with normalized grid coordinates around center (0, 0 = ground level)
        // Grid unit: 1 unit = 1 block size
        const addBlock = (gx, gy, color, highlight, layerGroup, isAccessory = false, shape = 'block') => {
          blocks.push({
            gx,
            gy, // gy=0 is resting on snow hill, negative goes upward
            color,
            highlight,
            layerGroup,
            isAccessory,
            shape,
            // Animation state
            delay: 0,
            progress: 0, // 0 -> 1
            startYOffset: -14 - Math.random() * 10,
            landed: false,
            bouncePhase: 0
          });
        };

        // Palette
        const SNOW_MAIN = '#f1f7fd';
        const SNOW_SHADE = '#cfe2f5';
        const SNOW_HIGHLIGHT = '#ffffff';
        const COAL = '#1e293b';
        const CARROT = '#fb923c';
        const CARROT_TIP = '#ea580c';
        const SCARF_RED = '#ef4444';
        const SCARF_DARK = '#b91c1c';
        const HAT_DARK = '#0f172a';
        const HAT_BAND = '#38bdf8';
        const BOW_PINK = '#f472b6';
        const BOW_DARK = '#db2777';
        const BLUSH = '#fda4af';
        const WOOD = '#78350f';

        // --- LEFT SNOWMAN (Gentleman with Top Hat & Red Scarf) ---
        // Center X = -6.5
        const lx = -6.5;

        // Base snowball (bottom-up rows gy = 0 to -5)
        for (let dy = 0; dy <= 5; dy++) {
          const halfW = dy === 0 ? 3 : dy <= 3 ? 4 : 3;
          for (let dx = -halfW; dx <= halfW; dx++) {
            const isEdge = dx <= -halfW + 1;
            addBlock(lx + dx, -dy, isEdge ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 1);
          }
        }

        // Torso snowball (gy = -6 to -10)
        for (let dy = 6; dy <= 10; dy++) {
          const halfW = dy === 6 || dy === 10 ? 2 : 3;
          for (let dx = -halfW; dx <= halfW; dx++) {
            const isEdge = dx <= -halfW + 1;
            addBlock(lx + dx, -dy, isEdge ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 2);
          }
        }
        // Coal buttons on torso
        addBlock(lx + 0.5, -7, COAL, '#475569', 2, true);
        addBlock(lx + 0.5, -9, COAL, '#475569', 2, true);

        // Red Scarf (gy = -11)
        for (let dx = -3; dx <= 3; dx++) {
          addBlock(lx + dx, -11, dx % 2 === 0 ? SCARF_RED : SCARF_DARK, '#fca5a5', 3, true);
        }
        // Scarf hanging tail
        addBlock(lx - 2, -10, SCARF_RED, '#fca5a5', 3, true);
        addBlock(lx - 2, -9, SCARF_DARK, '#fca5a5', 3, true);

        // Head snowball (gy = -12 to -15)
        for (let dy = 12; dy <= 15; dy++) {
          const halfW = dy === 15 ? 2 : 2.5;
          for (let dx = -Math.floor(halfW); dx <= Math.floor(halfW); dx++) {
            addBlock(lx + dx, -dy, dx === -Math.floor(halfW) ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 3);
          }
        }
        // Eyes & Carrot Nose
        addBlock(lx - 0.8, -14, COAL, '#64748b', 3, true);
        addBlock(lx + 1.2, -14, COAL, '#64748b', 3, true);
        addBlock(lx + 0.3, -13, CARROT, '#fed7aa', 3, true);
        addBlock(lx + 1.3, -13, CARROT_TIP, '#fed7aa', 3, true);
        // Cute Happy Coal Smile
        addBlock(lx - 0.6, -12.2, COAL, '#64748b', 3, true);
        addBlock(lx + 0.2, -12.0, COAL, '#64748b', 3, true);
        addBlock(lx + 1.0, -12.2, COAL, '#64748b', 3, true);

        // Top Hat (gy = -16 to -19)
        for (let dx = -3; dx <= 3; dx++) {
          addBlock(lx + dx, -16, HAT_DARK, '#334155', 4, true); // Brim
        }
        for (let dy = 17; dy <= 19; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const c = dy === 17 ? HAT_BAND : HAT_DARK;
            addBlock(lx + dx, -dy, c, '#7dd3fc', 4, true);
          }
        }

        // --- RIGHT SNOWWOMAN (Cute Bow/Earmuffs, Rosy Blush & Pink Scarf) ---
        // Center X = +6.5
        const rx = 6.5;

        // Base snowball (gy = 0 to -5)
        for (let dy = 0; dy <= 5; dy++) {
          const halfW = dy === 0 ? 3 : dy <= 3 ? 4 : 3;
          for (let dx = -halfW; dx <= halfW; dx++) {
            const isEdge = dx >= halfW - 1;
            addBlock(rx + dx, -dy, isEdge ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 1);
          }
        }

        // Torso snowball (gy = -6 to -10)
        for (let dy = 6; dy <= 10; dy++) {
          const halfW = dy === 6 || dy === 10 ? 2 : 3;
          for (let dx = -halfW; dx <= halfW; dx++) {
            const isEdge = dx >= halfW - 1;
            addBlock(rx + dx, -dy, isEdge ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 2);
          }
        }
        // Heart/Pink buttons
        addBlock(rx - 0.5, -7, BOW_PINK, '#fbcfe8', 2, true);
        addBlock(rx - 0.5, -9, BOW_PINK, '#fbcfe8', 2, true);

        // Pink Scarf (gy = -11)
        for (let dx = -3; dx <= 3; dx++) {
          addBlock(rx + dx, -11, dx % 2 === 0 ? BOW_PINK : BOW_DARK, '#fbcfe8', 3, true);
        }
        addBlock(rx + 2, -10, BOW_PINK, '#fbcfe8', 3, true);
        addBlock(rx + 2, -9, BOW_DARK, '#fbcfe8', 3, true);

        // Head snowball (gy = -12 to -15)
        for (let dy = 12; dy <= 15; dy++) {
          const halfW = dy === 15 ? 2 : 2.5;
          for (let dx = -Math.floor(halfW); dx <= Math.floor(halfW); dx++) {
            addBlock(rx + dx, -dy, dx === Math.floor(halfW) ? SNOW_SHADE : SNOW_MAIN, SNOW_HIGHLIGHT, 3);
          }
        }
        // Eyes, Rosy Blush & Cute Nose
        addBlock(rx - 1.2, -14, COAL, '#64748b', 3, true);
        addBlock(rx + 0.8, -14, COAL, '#64748b', 3, true);
        addBlock(rx - 1.8, -13, BLUSH, '#ffe4e6', 3, true);
        addBlock(rx + 1.5, -13, BLUSH, '#ffe4e6', 3, true);
        addBlock(rx - 0.3, -13, CARROT, '#fed7aa', 3, true);
        // Cute Happy Coal Smile
        addBlock(rx - 1.0, -12.2, COAL, '#64748b', 3, true);
        addBlock(rx - 0.2, -12.0, COAL, '#64748b', 3, true);
        addBlock(rx + 0.6, -12.2, COAL, '#64748b', 3, true);

        // Cute Pink Earmuffs & Top Bow (gy = -14 to -17)
        addBlock(rx - 3, -14, BOW_PINK, '#fbcfe8', 4, true);
        addBlock(rx + 3, -14, BOW_PINK, '#fbcfe8', 4, true);
        addBlock(rx - 1, -16, BOW_PINK, '#fbcfe8', 4, true);
        addBlock(rx, -16, BOW_DARK, '#fbcfe8', 4, true);
        addBlock(rx + 1, -16, BOW_PINK, '#fbcfe8', 4, true);
        addBlock(rx - 1, -17, BOW_DARK, '#fbcfe8', 4, true);
        addBlock(rx + 1, -17, BOW_DARK, '#fbcfe8', 4, true);

        // --- HOLDING HANDS (Twig Arms connecting in the center!) ---
        // Left snowman right arm reaching inward
        addBlock(lx + 3.5, -9, WOOD, '#b45309', 5, true);
        addBlock(lx + 4.5, -8.5, WOOD, '#b45309', 5, true);
        addBlock(lx + 5.5, -8, WOOD, '#b45309', 5, true);

        // Right snowwoman left arm reaching inward to hold hands
        addBlock(rx - 3.5, -9, WOOD, '#b45309', 5, true);
        addBlock(rx - 4.5, -8.5, WOOD, '#b45309', 5, true);
        addBlock(rx - 5.5, -8, WOOD, '#b45309', 5, true);

        // Outer waving twig arms
        addBlock(lx - 4, -9, WOOD, '#b45309', 5, true);
        addBlock(lx - 5, -10, WOOD, '#b45309', 5, true);
        addBlock(rx + 4, -9, WOOD, '#b45309', 5, true);
        addBlock(rx + 5, -10, WOOD, '#b45309', 5, true);

        // Sort blocks bottom-to-top (gy descending from 0 to -19), then left-to-right for natural block-by-block cascade
        blocks.sort((a, b) => {
          if (a.layerGroup !== b.layerGroup) return a.layerGroup - b.layerGroup;
          if (Math.abs(a.gy - b.gy) > 0.1) return b.gy - a.gy;
          return a.gx - b.gx;
        });

        const SONG_SECONDS = 30;

        const BUILD_STEP = (SONG_SECONDS - 1.0) / Math.max(1, blocks.length - 1);

        // Assign sequential stagger delays
        blocks.forEach((blk, idx) => {
          blk.delay = idx * BUILD_STEP; // slow cascade: whole build lasts ~30s (song length)
        });

        return blocks;
      }

      const musicBox = new HolidaySnowmanMusicEngine();

      // YouTube IFrame controller for Sia - Snowman (gset79KMmt0) during building animation
      const snowmanYouTube = {
        audio: null,
        blobUrl: null,
        ready: false,
        wantPlay: false,
        // Web Audio fallback (used if <audio> fails on some mobile/in-app browsers)
        wa: { ctx: null, gain: null, buffer: null, src: null, on: false },
        bytes() {
          const b64 = SNOWMAN_MP3.split(',')[1];
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return arr;
        },
        init() {
          if (this.audio) return;
          let url = SNOWMAN_MP3;
          try {
            this.blobUrl = URL.createObjectURL(new Blob([this.bytes()], { type: 'audio/mpeg' }));
            url = this.blobUrl;
          } catch (_) {}
          const a = new Audio();
          a.preload = 'auto';
          a.loop = false;
          a.setAttribute('playsinline', '');
          a.setAttribute('webkit-playsinline', '');
          a.src = url;
          a.volume = musicBox.volume;
          a.addEventListener('playing', () => { audioStatusEl.textContent = '♫ Playing'; });
          a.addEventListener('error', () => { this.startWebAudio(); });
          this.audio = a;
          this.ready = true;
        },
        startWebAudio() {
          if (!this.wantPlay) return;
          try {
            const w = this.wa;
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { audioStatusEl.textContent = '♪ Audio not supported'; return; }
            if (!w.ctx) {
              w.ctx = new AC();
              w.gain = w.ctx.createGain();
              w.gain.connect(w.ctx.destination);
            }
            w.gain.gain.value = musicBox.volume;
            if (w.ctx.state === 'suspended') w.ctx.resume();
            const go = () => {
              if (!this.wantPlay || w.on) return;
              w.src = w.ctx.createBufferSource();
              w.src.buffer = w.buffer;
              w.src.loop = false;
              w.src.connect(w.gain);
              w.src.start(0);
              w.on = true;
              audioStatusEl.textContent = '♫ Playing';
            };
            if (w.buffer) { go(); return; }
            const ab = this.bytes().buffer;
            const done = (buf) => { w.buffer = buf; go(); };
            const fail = () => { audioStatusEl.textContent = '♪ Tap to play'; };
            const r = w.ctx.decodeAudioData(ab, done, fail);
            if (r && r.catch) r.catch(fail);
          } catch (_) { audioStatusEl.textContent = '♪ Tap to play'; }
        },
        stopWebAudio() {
          const w = this.wa;
          if (w.src) { try { w.src.stop(); } catch (_) {} w.src = null; }
          w.on = false;
        },
        play() {
          this.init();
          this.wantPlay = true;
          this.audio.volume = musicBox.volume;
          const p = this.audio.play();
          if (p && typeof p.catch === 'function') {
            p.catch(() => { this.startWebAudio(); });
          }
          // Safety net: if nothing is actually playing shortly after, switch to Web Audio
          const startedAt = this.audio.currentTime;
          setTimeout(() => {
            if (this.wantPlay && !this.wa.on && (this.audio.paused || this.audio.currentTime === startedAt)) {
              this.startWebAudio();
            }
          }, 1200);
        },
        pause() {
          this.wantPlay = false;
          if (this.audio) this.audio.pause();
          this.stopWebAudio();
          audioStatusEl.textContent = '♪ Paused';
        },
        restart() {
          this.init();
          this.stopWebAudio();
          try { this.audio.currentTime = 0; } catch (_) {}
          this.play();
        },
        setVolume(val) {
          musicBox.volume = Math.max(0, Math.min(1, val));
          if (this.audio) this.audio.volume = musicBox.volume;
          if (this.wa.gain) this.wa.gain.gain.value = musicBox.volume;
        }
      };

      // Viewport & DPI metrics
      let width = window.innerWidth || 800;
      let height = window.innerHeight || 500;
      let dpr = 1;
      let blockSize = 14;
      let groundY = height * 0.83;

      // Simulation State
      let isRunning = false;
      let elapsedBuildTime = 0;
      let totalBuildDuration = 0;
      let blocks = buildSnowCoupleBlocks();
      totalBuildDuration = blocks[blocks.length - 1].delay + 1.0;

      // Dynamic Particles
      let snowflakes = [];
      let hearts = [];
      let sparkles = [];
      let heartSpawnTimer = 0;
      let coupleComplete = false;
      let swayTime = 0;

      // Initialize Snowflakes
      function initSnowflakes(count = 85) {
        snowflakes = [];
        for (let i = 0; i < count; i++) {
          snowflakes.push({
            x: Math.random() * (width || 800),
            y: Math.random() * (height || 500),
            r: 1.2 + Math.random() * 2.6,
            speedY: 22 + Math.random() * 38,
            driftAmp: 12 + Math.random() * 24,
            driftFreq: 0.8 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.35 + Math.random() * 0.6
          });
        }
      }

      // Spawn Floating Pixel/Vector Heart
      function spawnHeart(x, y, burst = false) {
        const colors = ['#f472b6', '#fb7185', '#f43f5e', '#fda4af', '#e879f9'];
        hearts.push({
          x,
          y,
          vx: burst ? (Math.random() - 0.5) * 90 : (Math.random() - 0.5) * 22,
          vy: burst ? -45 - Math.random() * 65 : -32 - Math.random() * 28,
          size: burst ? 8 + Math.random() * 7 : 9 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          life: 0,
          maxLife: burst ? 1.5 + Math.random() * 0.8 : 2.8 + Math.random() * 1.2,
          wobblePhase: Math.random() * Math.PI * 2
        });
      }

      // Spawn Ground/Air Sparkles
      function spawnSparkle(x, y, color = '#bae6fd') {
        sparkles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 40,
          vy: -15 - Math.random() * 35,
          size: 2 + Math.random() * 3,
          color,
          life: 0,
          maxLife: 0.55 + Math.random() * 0.45
        });
      }

      // Pre-render Static Winter Night Backdrop to Offscreen Canvas
      function renderStaticBackground() {
        bgCanvas.width = Math.max(1, Math.floor(width * dpr));
        bgCanvas.height = Math.max(1, Math.floor(height * dpr));
        bgCtx.save();
        bgCtx.scale(dpr, dpr);

        // 1. Deep Starry Night Sky Gradient
        const skyGrad = bgCtx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, '#020813');
        skyGrad.addColorStop(0.55, '#09192f');
        skyGrad.addColorStop(1, '#122b49');
        bgCtx.fillStyle = skyGrad;
        bgCtx.fillRect(0, 0, width, height);

        // 2. Subtle Glowing Aurora Borealis Ribbons
        bgCtx.save();
        const auroraGrad = bgCtx.createLinearGradient(0, height * 0.08, width, height * 0.45);
        auroraGrad.addColorStop(0, 'rgba(45, 212, 191, 0.02)');
        auroraGrad.addColorStop(0.35, 'rgba(56, 189, 248, 0.09)');
        auroraGrad.addColorStop(0.7, 'rgba(168, 85, 247, 0.07)');
        auroraGrad.addColorStop(1, 'rgba(45, 212, 191, 0.01)');
        bgCtx.fillStyle = auroraGrad;
        bgCtx.beginPath();
        bgCtx.moveTo(0, height * 0.35);
        bgCtx.bezierCurveTo(width * 0.3, height * 0.12, width * 0.65, height * 0.42, width, height * 0.18);
        bgCtx.lineTo(width, height * 0.48);
        bgCtx.bezierCurveTo(width * 0.6, height * 0.62, width * 0.35, height * 0.28, 0, height * 0.52);
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.restore();

        // 3. Deterministic Crisp Stars
        const starCount = Math.floor((width * height) / 4800);
        for (let i = 0; i < starCount; i++) {
          const sx = ((i * 7919) % 1000) / 1000 * width;
          const sy = ((i * 6271) % 1000) / 1000 * (height * 0.68);
          const sr = (i % 3 === 0) ? 1.5 : 0.9;
          const alpha = 0.3 + ((i * 31) % 70) / 100;
          bgCtx.fillStyle = i % 5 === 0 ? `rgba(186, 230, 253, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
          bgCtx.beginPath();
          bgCtx.arc(sx, sy, sr, 0, Math.PI * 2);
          bgCtx.fill();
        }

        // 4. Crescent/Full Glowing Winter Moon
        const moonX = width * 0.82;
        const moonY = height * 0.18;
        const moonR = Math.min(width, height) * 0.055;

        const moonHalo = bgCtx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 4.5);
        moonHalo.addColorStop(0, 'rgba(224, 242, 254, 0.26)');
        moonHalo.addColorStop(0.5, 'rgba(56, 189, 248, 0.07)');
        moonHalo.addColorStop(1, 'rgba(2, 8, 19, 0)');
        bgCtx.fillStyle = moonHalo;
        bgCtx.beginPath();
        bgCtx.arc(moonX, moonY, moonR * 4.5, 0, Math.PI * 2);
        bgCtx.fill();

        bgCtx.fillStyle = '#f8fafc';
        bgCtx.beginPath();
        bgCtx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        bgCtx.fill();

        // Soft moon craters
        bgCtx.fillStyle = 'rgba(203, 213, 225, 0.45)';
        bgCtx.beginPath();
        bgCtx.arc(moonX - moonR * 0.28, moonY - moonR * 0.15, moonR * 0.22, 0, Math.PI * 2);
        bgCtx.arc(moonX + moonR * 0.25, moonY + moonR * 0.25, moonR * 0.15, 0, Math.PI * 2);
        bgCtx.fill();

        // 5. Distant Snowy Hills
        bgCtx.fillStyle = '#0f243e';
        bgCtx.beginPath();
        bgCtx.moveTo(0, height);
        bgCtx.lineTo(0, groundY - height * 0.06);
        bgCtx.quadraticCurveTo(width * 0.28, groundY - height * 0.14, width * 0.55, groundY - height * 0.05);
        bgCtx.quadraticCurveTo(width * 0.82, groundY + height * 0.02, width, groundY - height * 0.08);
        bgCtx.lineTo(width, height);
        bgCtx.closePath();
        bgCtx.fill();

        // 6. Foreground Sparkling Snow Ground
        const groundGrad = bgCtx.createLinearGradient(0, groundY - 12, 0, height);
        groundGrad.addColorStop(0, '#e0f2fe');
        groundGrad.addColorStop(0.25, '#bae6fd');
        groundGrad.addColorStop(1, '#7dd3fc');
        bgCtx.fillStyle = groundGrad;
        bgCtx.beginPath();
        bgCtx.moveTo(0, height);
        bgCtx.lineTo(0, groundY + 4);
        bgCtx.quadraticCurveTo(width * 0.5, groundY - 14, width, groundY + 4);
        bgCtx.lineTo(width, height);
        bgCtx.closePath();
        bgCtx.fill();

        // Subtle snow rim highlight
        bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        bgCtx.lineWidth = 2;
        bgCtx.beginPath();
        bgCtx.moveTo(0, groundY + 4);
        bgCtx.quadraticCurveTo(width * 0.5, groundY - 14, width, groundY + 4);
        bgCtx.stroke();

        bgCtx.restore();
      }

      // Resize & High-DPI Smart Scaling Handler
      function handleResize() {
        const rect = screenEl ? screenEl.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
        width = Math.max(280, rect.width || window.innerWidth || 800);
        height = Math.max(220, rect.height || window.innerHeight || 500);

        // Cap DPR at 2 on mobile devices for guaranteed 60fps smoothness while keeping crisp Retina quality
        const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window);
        const rawDpr = window.devicePixelRatio || 1;
        dpr = isMobile ? Math.min(rawDpr, 2) : Math.min(rawDpr, 2.5);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        // Responsive block sizing so Snow Couple fits beautifully on both portrait mobile and widescreen PC
        const maxCoupleWidthBlocks = 23;
        const maxCoupleHeightBlocks = 22;
        const sizeByW = (width * 0.78) / maxCoupleWidthBlocks;
        const sizeByH = (height * 0.66) / maxCoupleHeightBlocks;
        blockSize = Math.max(7, Math.min(20, Math.min(sizeByW, sizeByH)));

        groundY = height * 0.83;

        renderStaticBackground();
        if (snowflakes.length === 0) {
          initSnowflakes(isMobile ? 60 : 95);
        }
      }

      // Draw a single glossy pixel/voxel block
      function drawBlock(x, y, size, color, highlight, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const r = Math.max(2, size * 0.2);

        // Main block body
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, r);
        ctx.fill();

        // Top-left crisp highlight bevel
        ctx.fillStyle = highlight;
        ctx.globalAlpha = alpha * 0.35;
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, size - 2, size * 0.32, r * 0.6);
        ctx.fill();

        // Subtle pixel grid border for "block by block" clarity
        ctx.globalAlpha = alpha * 0.16;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);

        ctx.restore();
      }

      // Draw crisp heart shape
      function drawHeartShape(x, y, size, color, alpha) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;

        const s = size * 0.55;
        ctx.beginPath();
        ctx.moveTo(0, s * 0.35);
        ctx.bezierCurveTo(-s, -s * 0.45, -s * 1.45, s * 0.45, 0, s * 1.35);
        ctx.bezierCurveTo(s * 1.45, s * 0.45, s, -s * 0.45, 0, s * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Spring ease-out for block drop
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      // Main Frame Update & Render Loop (Delta-Time Normalized)
      let lastTimestamp = performance.now();

      function frame(now) {
        const rawDt = (now - lastTimestamp) / 1000;
        lastTimestamp = now;
        // Clamp dt to prevent huge jumps if tab was backgrounded
        const dt = Math.min(rawDt, 0.05);

        // 1. Blit pre-rendered static background (Zero-lag single drawImage call)
        ctx.drawImage(bgCanvas, 0, 0);

        ctx.save();
        ctx.scale(dpr, dpr);

        // 2. Update & Draw Snowflakes
        for (let i = 0; i < snowflakes.length; i++) {
          const sf = snowflakes[i];
          if (isRunning) {
            sf.y += sf.speedY * dt;
            sf.x += Math.sin(now * 0.001 * sf.driftFreq + sf.phase) * sf.driftAmp * dt;
            if (sf.y > height + 8) {
              sf.y = -8;
              sf.x = Math.random() * width;
            }
            if (sf.x < -12) sf.x = width + 12;
            if (sf.x > width + 12) sf.x = -12;
          }

          ctx.fillStyle = `rgba(255, 255, 255, ${sf.alpha})`;
          ctx.beginPath();
          ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. Advance Build Timeline & Completion State
        if (isRunning) {
          if (!coupleComplete) {
            elapsedBuildTime += dt;
          } else {
            swayTime += dt;
            heartSpawnTimer += dt;
            if (heartSpawnTimer >= 0.48) {
              heartSpawnTimer = 0;
              const centerX = width * 0.5;
              const topHeartY = groundY - blockSize * 17;
              spawnHeart(centerX + (Math.random() - 0.5) * blockSize * 12, topHeartY, false);
            }
          }
        }

        // Update UI Progress Bar
        const pct = Math.min(100, Math.round((elapsedBuildTime / totalBuildDuration) * 100));
        progressBar.style.width = `${pct}%`;
        progressLabel.textContent = `${pct}%`;

        // Synchronize romantic holiday lyric captions while building
        if (isRunning && !coupleComplete && snowmanYouTube.ready) {
          subtitleEl.textContent = '♫ Sia – Snowman ☃️❄️';
        }

        if (pct >= 100 && !coupleComplete) {
          coupleComplete = true;
          elapsedBuildTime = totalBuildDuration;
          progressBar.style.width = '100%';
          progressLabel.textContent = '100%';
          if (isRunning) {
            statusBadge.textContent = 'Together 💕';
            statusBadge.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-pink-950/80 border border-pink-500/50 text-pink-300';
            subtitleEl.textContent = 'Holding hands in the winter night ✨❄️';
          }
          // Music plays strictly while the snowman building animation is in progress
          snowmanYouTube.pause();

          const centerX = width * 0.5;
          for (let i = 0; i < 16; i++) {
            spawnHeart(centerX + (Math.random() - 0.5) * blockSize * 10, groundY - blockSize * 10, true);
          }
          for (let i = 0; i < 24; i++) {
            spawnSparkle(centerX + (Math.random() - 0.5) * blockSize * 18, groundY - Math.random() * blockSize * 16, '#fbcfe8');
          }
        }

        // 4. Update & Draw Snow Couple Blocks
        const centerX = width * 0.5;
        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          const localTime = elapsedBuildTime - b.delay;
          if (localTime <= 0) continue;

          const rawP = Math.min(1, localTime / 0.9);
          if (rawP >= 1 && !b.landed) {
            b.landed = true;
            const landX = centerX + b.gx * blockSize;
            const landY = groundY + (b.gy - 0.35) * blockSize;
            for (let s = 0; s < 2; s++) {
              spawnSparkle(landX, landY, b.isAccessory ? '#fbcfe8' : '#e0f2fe');
            }
          }

          const eased = easeOutBack(rawP);
          const yDropOffset = (1 - eased) * (b.startYOffset * blockSize);

          // Apply subtle affectionate lean toward center once built
          const isLeft = b.gx < 0;
          const heightRatio = Math.abs(b.gy) / 18;
          const affectionShift = coupleComplete
            ? (isLeft ? 1 : -1) * heightRatio * blockSize * 0.45 + Math.sin(swayTime * 2.2) * heightRatio * 2.2
            : 0;

          const drawX = centerX + b.gx * blockSize - blockSize * 0.5 + affectionShift;
          const drawY = groundY + (b.gy - 0.85) * blockSize + yDropOffset;
          const alpha = Math.min(1, rawP * 2.4);

          drawBlock(drawX, drawY, blockSize * 0.96, b.color, b.highlight, alpha);
        }

        // 5. Draw Glowing Center Love Aura when holding hands
        if (coupleComplete) {
          const pulse = 0.5 + 0.5 * Math.sin(swayTime * 3.5);
          const heartCenterX = centerX;
          const heartCenterY = groundY - blockSize * 12.5;

          const glow = ctx.createRadialGradient(heartCenterX, heartCenterY, 2, heartCenterX, heartCenterY, blockSize * 4.5);
          glow.addColorStop(0, `rgba(244, 114, 182, ${0.22 + pulse * 0.14})`);
          glow.addColorStop(1, 'rgba(244, 114, 182, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(heartCenterX, heartCenterY, blockSize * 4.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 6. Update & Render Floating Hearts
        for (let i = hearts.length - 1; i >= 0; i--) {
          const h = hearts[i];
          if (isRunning) {
            h.life += dt;
            h.x += (h.vx + Math.sin(h.life * 3.5 + h.wobblePhase) * 14) * dt;
            h.y += h.vy * dt;
          }
          if (h.life >= h.maxLife) {
            hearts.splice(i, 1);
            continue;
          }
          const fade = h.life < 0.25 ? h.life / 0.25 : 1 - (h.life - 0.25) / (h.maxLife - 0.25);
          drawHeartShape(h.x, h.y, h.size, h.color, fade);
        }

        // 7. Update & Render Sparkles
        for (let i = sparkles.length - 1; i >= 0; i--) {
          const sp = sparkles[i];
          if (isRunning) {
            sp.life += dt;
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
          }
          if (sp.life >= sp.maxLife) {
            sparkles.splice(i, 1);
            continue;
          }
          const alpha = 1 - sp.life / sp.maxLife;
          ctx.fillStyle = sp.color;
          ctx.globalAlpha = alpha;
          ctx.fillRect(sp.x - sp.size * 0.5, sp.y - sp.size * 0.5, sp.size, sp.size);
          ctx.globalAlpha = 1;
        }

        ctx.restore();
        requestAnimationFrame(frame);
      }

      // ==========================================
      // 4. INTERACTIVE CONTROLS & EVENTS
      // ==========================================
      function setRunningState(running) {
        isRunning = running;
        if (isRunning) {
          btnStart.classList.add('active');
          btnStop.classList.remove('active');
          statusBadge.textContent = coupleComplete ? 'Together 💕' : 'Building ❄️';
          if (!coupleComplete) {
            snowmanYouTube.play();
          }
        } else {
          btnStart.classList.remove('active');
          btnStop.classList.add('active');
          statusBadge.textContent = 'Paused';
          snowmanYouTube.pause();
        }
      }

      function replayAnimation() {
        elapsedBuildTime = 0;
        coupleComplete = false;
        heartSpawnTimer = 0;
        swayTime = 0;
        hearts = [];
        sparkles = [];
        blocks.forEach(b => {
          b.progress = 0;
          b.landed = false;
        });
        subtitleEl.textContent = 'Watch them build, block by block… ❄️';
        statusBadge.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-sky-950/80 border border-sky-700/50 text-sky-300';
        setRunningState(true);
        snowmanYouTube.restart();
      }

      btnStart.addEventListener('click', () => {
        if (coupleComplete) { replayAnimation(); return; }
        setRunningState(true);
      });

      btnStop.addEventListener('click', () => {
        setRunningState(false);
      });

      btnReplay.addEventListener('click', () => {
        replayAnimation();
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        snowmanYouTube.setVolume(val);
        volIcon.textContent = val === 0 ? '🔇' : val < 0.4 ? '♪' : '♫';
      });

      // Tap / Click anywhere on the canvas to burst hearts & play chime
      screenEl.addEventListener('pointerdown', (e) => {
        const rect = screenEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (isRunning) musicBox.playSparkleChime();

        for (let i = 0; i < 5; i++) {
          spawnHeart(x, y, true);
        }
        for (let i = 0; i < 8; i++) {
          spawnSparkle(x, y, i % 2 === 0 ? '#fbcfe8' : '#7dd3fc');
        }

        if (tapHint) {
          tapHint.style.opacity = '0';
        }
      });

      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => setTimeout(handleResize, 250));
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isRunning) setRunningState(false);
      });

      // Boot sequence safely after DOM layout
      function bootApp() {
        handleResize();
        statusBadge.textContent = 'Ready';
        btnStart.classList.remove('active');
        btnStop.classList.add('active');
        subtitleEl.textContent = 'Press ▶ Start to begin ❄️';
        audioStatusEl.textContent = '♪ Ready';
        snowmanYouTube.init();
        requestAnimationFrame(frame);
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', bootApp);
      } else {
        bootApp();
      }
    })();
  </script>
</body>
</html>
